<div class="card mb-4">

  <div class="card-header">
    Excel Upload
  </div>
  <div class="card-body">
    <input
      type="file"
      class="form-control"
      accept=".xlsx,.xls"
      (change)="onFileSelected($event)">
    <div class="mt-2">
      @if(selectedFile){
        <span>
          {{ selectedFile.name }}
        </span>
      } @else {
        <span>
          Keine Datei ausgewählt
        </span>
      }
    </div>
    <div class="mt-3">
      <button
        class="btn btn-primary me-2"
        (click)="upload()">
        Analysieren
      </button>
      <button
        class="btn btn-secondary"
        (click)="reset()">
        Zurücksetzen
      </button>
    </div>
  </div>
</div>
