<mat-card class="upload-card">
  <mat-card-header>
    <mat-card-title>
      📊 Excel Upload
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="drop-zone">
      <mat-icon class="upload-icon">
        folder_open
      </mat-icon>
      <h3>
        Excel-Datei auswählen
      </h3>
      <p>
        Unterstützte Formate: .xls, .xlsx
      </p>
      <input
        #fileInput
        type="file"
        accept=".xls,.xlsx"
        hidden
        (change)="onFileSelected($event)">
      <button
        mat-stroked-button
        color="primary"
        (click)="fileInput.click()">
        Datei auswählen
      </button>
      @if (selectedFile) {
        <div class="selected-file">
          {{ selectedFile.name }}
        </div>
      }
    </div>
    <div class="button-bar">
      <button
        mat-raised-button
        color="primary"
        (click)="upload()">
        Analysieren
      </button>
      <button
        mat-stroked-button
        (click)="reset()">
        Zurücksetzen
      </button>
    </div>
  </mat-card-content>
</mat-card>
