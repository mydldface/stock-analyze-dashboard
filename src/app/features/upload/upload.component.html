<div class="card upload-card">

  <div class="card-header">
    📊 Excel Upload
  </div>
  <div class="card-body">
    <label class="upload-zone">
      <input
        type="file"
        accept=".xlsx,.xls"
        (change)="onFileSelected($event)"
        hidden>
      <div class="upload-text">
        <div class="upload-icon">
          📁
        </div>
        <div>
          @if (selectedFile) {
            <strong>
              {{ selectedFile.name }}
            </strong>
          } @else {
            <strong>
              Excel-Datei auswählen
            </strong>
          }
        </div>
        <small>
          Unterstützte Formate: .xls, .xlsx
        </small>
      </div>
    </label>
    <div class="button-bar">
      <button
        type="button"
        class="btn btn-primary"
        (click)="upload()">
        Analysieren
      </button>
      <button
        type="button"
        class="btn btn-light"
        (click)="reset()">
        Zurücksetzen
      </button>
    </div>
  </div>
</div>
