<h2 mat-dialog-title>
  Manuelle Analyse
</h2>
<mat-dialog-content>
  <app-manual-analysis
    (analyzed)="analysisFinished($event)">
  </app-manual-analysis>
  @if (result) {
    <div class="analysis-result-layout">
      <app-signal-panel
        [stock]="result">
      </app-signal-panel>
      <app-chart
        [stock]="result">
      </app-chart>
    </div>
  }

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-button
    mat-dialog-close>
    Abbrechen
  </button>
</mat-dialog-actions>
