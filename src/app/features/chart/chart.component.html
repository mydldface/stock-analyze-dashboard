<mat-card class="chart-card">
  <mat-card-header>
    <mat-card-title>
      Candlestick Chart
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="chart-legend">
      <span class="legend-item">
        <span class="dot previous"></span>
        Linke Kerze = Vortageskerze
      </span>
      <span class="legend-item">
        <span class="dot current"></span>
        Rechte Kerze = Aktuelle Kerze
      </span>
    </div>
    <div
      #chartContainer
      class="chart-container">
    </div>
  </mat-card-content>
</mat-card>
