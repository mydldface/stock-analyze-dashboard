<div class="card stock-selector-card">
  <div class="card-header">
    <span class="selector-title">
      Aktie auswählen
    </span>
  </div>
  <div class="card-body">
    <div class="stock-select-field">
      <select
        class="stock-select"
        (change)="change($any($event.target).value)">
        @for (stock of stocks; track stock.symbol) {
          <option [value]="stock.symbol">
            {{ stock.symbol }}
          </option>
        }
      </select>
    </div>

    @if (stocks.length > 0) {
      <div class="stock-count">
        {{ stocks.length }} Aktie(n) verfügbar
      </div>
    }
  </div>
</div>
