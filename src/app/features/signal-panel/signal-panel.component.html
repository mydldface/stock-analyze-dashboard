<mat-card class="signal-card">
  <mat-card-header>
    <mat-card-title>
      Aktuelles Signal
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (stock) {
      <div class="symbol">
        {{ stock.symbol }}
      </div>
      <div
        class="pattern"
        [class.bullish]="stock.pattern.includes('BULL')"
        [class.bearish]="stock.pattern.includes('BEAR')">
        {{ stock.pattern }}
      </div>
      @if (stock.signal.includes('BUY')) {
        <mat-chip class="buy-chip">
          {{ stock.signal }}
        </mat-chip>
      } @else if (stock.signal.includes('SELL')) {
        <mat-chip class="sell-chip">
          {{ stock.signal }}
        </mat-chip>
      } @else {
        <mat-chip class="watch-chip">
          {{ stock.signal }}
        </mat-chip>
      }
    } @else {
      <div class="empty-state">
        Keine Aktie ausgewählt
      </div>
    }
  </mat-card-content>
</mat-card>
