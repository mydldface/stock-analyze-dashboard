<div class="dashboard-container">
  <h1 class="dashboard-title">
    Stock Analyze Dashboard
  </h1>

  <!-- Upload/Reset -->
  <mat-card class="dashboard-card">
    <app-upload
      (uploaded)="uploadFinished($event)"
      (cleared)="resetDashboard()">
    </app-upload>
  </mat-card>

  <!-- Manuelle Analyse -->
  <mat-card class="dashboard-card">
  <button mat-raised-button color="primary"
    (click)="openManualAnalysis()">
    Manuelle Analyse
  </button>
  </mat-card>
  <!--
  <mat-card class="dashboard-card">
    <mat-card-content>
      <app-manual-analysis
        (analyzed)="manualAnalysisFinished($event)">
      </app-manual-analysis>
    </mat-card-content>
  </mat-card>
  -->
  <!-- Aktienauswahl -->
  <mat-card class="dashboard-card">
    <mat-card-header>
      <mat-card-title>
        Aktie auswählen
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-stock-selector
        [stocks]="results"
        (selected)="stockSelected($event)">
      </app-stock-selector>
    </mat-card-content>
  </mat-card>

  <!-- Signal -->
  <mat-card class="dashboard-card">
    <mat-card-header>
      <mat-card-title>
        Aktuelles Signal
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-signal-panel
        [stock]="selectedStock">
      </app-signal-panel>
    </mat-card-content>
  </mat-card>

  <!-- Chart -->
  <mat-card class="dashboard-card chart-card">
    <mat-card-header>
      <mat-card-title>
        Candlestick Chart
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-chart
        [stock]="selectedStock">
      </app-chart>
    </mat-card-content>
  </mat-card>
  <!-- Ergebnisse -->
  <mat-card class="dashboard-card">
    <mat-card-header>
      <mat-card-title>
        Analyseergebnisse
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-result-table
        [results]="results">
      </app-result-table>
    </mat-card-content>
  </mat-card>
</div>
