<div class="container">
  <h1>
    Stock Analyze Dashboard
  </h1>
  <section class="dashboard-section">
    <app-upload
      (uploaded)="uploadFinished($event)">
    </app-upload>
  </section>
  <section class="dashboard-section">
    <app-stock-selector
      [stocks]="results"
      (selected)="stockSelected($event)">
    </app-stock-selector>
  </section>
  <section class="dashboard-section">
    <app-signal-panel
      [stock]="selectedStock">
    </app-signal-panel>
  </section>
  <section class="dashboard-section">
    <app-chart
      [stock]="selectedStock">
    </app-chart>
  </section>
  <section class="dashboard-section">
    <app-result-table
      [results]="results">
    </app-result-table>
  </section>
</div>
