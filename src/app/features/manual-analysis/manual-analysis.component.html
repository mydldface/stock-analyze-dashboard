<mat-card class="manual-analysis-card">
  <mat-card-header>
    <mat-card-title>
      Manuelle Analyse
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <!-- Stammdaten -->
    <div class="top-row">
      <mat-form-field
        appearance="outline"
        class="field-symbol">
        <mat-label>Symbol</mat-label>
        <input
          matInput
          [(ngModel)]="model.symbol">
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="field-small">
        <mat-label>Current Price</mat-label>
        <input
          matInput
          type="number"
          [(ngModel)]="model.currentPrice">
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="field-volume">
        <mat-label>Volume</mat-label>
        <input
          matInput
          type="number"
          [(ngModel)]="model.volume">
      </mat-form-field>
    </div>
    <!-- Vorperiode -->
    <mat-card class="candle-box">
      <mat-card-title>
        Vorperiode
      </mat-card-title>
      <div class="ohlc-grid">
        <mat-form-field appearance="outline">
          <mat-label>Open</mat-label>
          <input matInput type="number"
                 [(ngModel)]="model.prevOpen">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>High</mat-label>
          <input matInput type="number"
                 [(ngModel)]="model.prevHigh">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Low</mat-label>
          <input matInput type="number"
                 [(ngModel)]="model.prevLow">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Close</mat-label>
          <input matInput type="number"
                 [(ngModel)]="model.prevClose">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Volume</mat-label>
          <input matInput type="number"
                 [(ngModel)]="model.prevVolume">
        </mat-form-field>
      </div>
    </mat-card>

    <!-- Aktuelle Periode -->

    <mat-card class="candle-box">

      <mat-card-title>
        Aktuelle Periode
      </mat-card-title>

      <div class="ohlc-grid">

        <mat-form-field appearance="outline">
          <mat-label>Open</mat-label>
          <input matInput type="number"
                 [(ngModel)]="model.open">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>High</mat-label>
          <input matInput type="number"
                 [(ngModel)]="model.high">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Low</mat-label>
          <input matInput type="number"
                 [(ngModel)]="model.low">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Close</mat-label>
          <input matInput type="number"
                 [(ngModel)]="model.close">
        </mat-form-field>
      </div>
    </mat-card>
    <div class="action-bar">
      <button
        mat-raised-button
        color="primary"
        (click)="analyze()">
        Analyse starten
      </button>
    </div>
  </mat-card-content>
</mat-card>
