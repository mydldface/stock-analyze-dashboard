<mat-card class="results-card">
  <mat-card-header>
    <mat-card-title>
      Analyseergebnisse
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (results.length === 0) {
      <div class="empty-state">
        Keine Ergebnisse vorhanden
      </div>
    } @else {
      <table
        mat-table
        [dataSource]="results"
        class="results-table">
        <!-- Symbol -->
        <ng-container matColumnDef="symbol">
          <th
            mat-header-cell
            *matHeaderCellDef>
            Symbol
          </th>
          <td
            mat-cell
            *matCellDef="let row">
            <span class="symbol">
              {{ row.symbol }}
            </span>
          </td>
        </ng-container>
        <!-- Pattern -->
        <ng-container matColumnDef="pattern">
          <th
            mat-header-cell
            *matHeaderCellDef>
            Pattern
          </th>
          <td
            mat-cell
            *matCellDef="let row">
            {{ row.pattern }}
          </td>
        </ng-container>
        <!-- Signal -->
        <ng-container matColumnDef="signal">
          <th
            mat-header-cell
            *matHeaderCellDef>
            Signal
          </th>
          <td
            mat-cell
            *matCellDef="let row">
            @if (row.signal.includes('BUY')) {
              <mat-chip class="buy-chip">
                {{ row.signal }}
              </mat-chip>
            } @else if (row.signal.includes('SELL')) {
              <mat-chip class="sell-chip">
                {{ row.signal }}
              </mat-chip>
            } @else {
              <mat-chip class="watch-chip">
                {{ row.signal }}
              </mat-chip>
            }
          </td>
        </ng-container>
        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns">
        </tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns;">
        </tr>
      </table>
    }

  </mat-card-content>
</mat-card>
