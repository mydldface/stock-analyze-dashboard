<div class="card mt-3">
  <div class="card-header">
    Analyseergebnisse
  </div>
  <div class="card-body">
    @if (results.length === 0) {
      <p>
        Keine Ergebnisse vorhanden
      </p>
    } @else {
      <table class="table">
        <thead>
        <tr>
          <th>Symbol</th>
          <th>Pattern</th>
          <th>Signal</th>
        </tr>
        </thead>
        <tbody>
          @for (row of results; track row.symbol) {
            <tr>
              <td>{{ row.symbol }}</td>
              <td>{{ row.pattern }}</td>
              <td>{{ row.signal }}</td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>
</div>
